name: Build Windows Standalone EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare PDF.js assets
        run: npm run prepare:assets

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build Vite bundle
        run: npm run build

      - name: Package Windows Installer & Portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: JadePDF-Editor-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
